[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
build_flags =
    -D BOARD_M5STACK_ATOM
    -D CAN_DRIVER_TWAI
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    Links2004/WebSockets@^2.4.0

[env:esp32-mcp2515]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D BOARD_ESP32_GENERIC
    -D CAN_DRIVER_MCP2515
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    autowp/autowp-mcp2515@^1.3.0
    Links2004/WebSockets@^2.4.0
src_dir = .firmware

; ── NodeMCU v2 (ESP8266) + MCP2515 SPI CAN module ─────────────────────────────
; ESP8266 has no native CAN peripheral, so the MCP2515 SPI driver is the only
; option on this board.  HSPI pin assignments are fixed in silicon:
;   SCK=D5(GPIO14)  MISO=D6(GPIO12)  MOSI=D7(GPIO13)
; Only CS is configurable — we use D1(GPIO5), a safe non-bootstrap pin.
; LED uses the onboard blue LED on D4(GPIO2, active-LOW), button uses the
; onboard FLASH button on D3(GPIO0, active-LOW with internal pull-up).
[env:nodemcuv2-mcp2515]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; ESP8266 Arduino core omits %f from Serial.printf by default — the
; -Wl,-u,_printf_float linker flag below pulls in the float-printf helper
; so the BMS status prints (%.1fV, %.2fkW, …) render correctly.
build_flags =
    -D BOARD_NODEMCU
    -D CAN_DRIVER_MCP2515
    -Wl,-u,_printf_float
lib_deps =
    autowp/autowp-mcp2515@^1.3.0
    Links2004/WebSockets@^2.4.0
src_dir = .firmware
